name: misspell

on:
  push:
    branches:
      - master
    paths:
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  misspell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: misspell
        uses: reviewdog/action-misspell@d6429416b12b09b4e2768307d53bef58d172e962 # v1
        with:
          locale: "US"
