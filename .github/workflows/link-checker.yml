name: link-checker

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - lychee.toml
      - .github/workflows/link-checker.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - README.md
      - lychee.toml
      - .github/workflows/link-checker.yml

  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ runner.os }}-${{ hashFiles('lychee.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cache-lychee-${{ runner.os }}-${{ hashFiles('lychee.toml') }}-

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config ./lychee.toml README.md

  check-pr-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract added README links
        id: links
        shell: bash
        run: |
          set -euo pipefail

          git diff --unified=0 --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} HEAD -- README.md > readme.diff
          awk '/^\+[^+]/ { sub(/^\+/, ""); print }' readme.diff \
            | { grep -Eo 'https?://[^][) <>"]+' || [[ $? == 1 ]]; } \
            | sed -E 's/[),.;:!?]+$//' \
            | sort -u > pr-links.txt

          if [[ -s pr-links.txt ]]; then
            echo "has_links=true" >> "$GITHUB_OUTPUT"
            cat pr-links.txt
          else
            echo "has_links=false" >> "$GITHUB_OUTPUT"
            echo "No added README links to check."
          fi

      - name: Link Checker
        if: steps.links.outputs.has_links == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config ./lychee.toml pr-links.txt
